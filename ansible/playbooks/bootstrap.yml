---
- name: Wait for instances to finish booting
  hosts: all
  gather_facts: false
  become: true
  tags: [bootstrap]
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

    # cloud-init todavía puede estar usando dnf justo después del apply.
    # rc 2 = terminó con avisos recuperables
    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2]

    - name: Gather facts
      ansible.builtin.setup:

- name: Base configuration (cluster.md 1.1 / 2.1)
  hosts: all
  become: true
  tags: [bootstrap, common]
  roles:
    - common
