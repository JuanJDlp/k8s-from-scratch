[defaults]
inventory = inventories/aws/hosts.yml
roles_path = roles
collections_path = collections:~/.ansible/collections
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False
gathering = smart
forks = 10
timeout = 30
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
pipelining = True
# Las IPs se reutilizan en cada recreación con llaves de host nuevas: no guardar known_hosts.
# ControlPersist reutiliza la conexión (y el salto por el bastión) entre tareas.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
