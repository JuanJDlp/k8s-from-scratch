---
# cluster.md 2.2
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Disable swap persistently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# cluster.md 2.3
- name: Set SELinux to permissive
  ansible.posix.selinux:
    policy: targeted
    state: "{{ k8s_prereqs_selinux_state }}"

# cluster.md 2.4
- name: Load kernel modules now and on boot
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ k8s_prereqs_kernel_modules }}"

- name: Set kernel parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    sysctl_set: true
    reload: true
  loop: "{{ k8s_prereqs_sysctl | dict2items }}"
