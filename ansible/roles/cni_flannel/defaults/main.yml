---
# "latest" reproduce la guía; en producción fija una versión, ej: v0.27.4
cni_flannel_version: latest
cni_flannel_manifest_url: >-
  https://github.com/flannel-io/flannel/releases/{{
  'latest/download' if cni_flannel_version == 'latest' else 'download/' ~ cni_flannel_version
  }}/kube-flannel.yml
cni_flannel_manifest_dir: "{{ ansible_facts['user_dir'] }}/manifests"
cni_flannel_rollout_timeout: 300s
