---
- name: Get installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_control_plane_version
  changed_when: false
  check_mode: false

- name: Write kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_control_plane_config_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_control_plane_admin_conf

- name: Initialize the control plane
  when: not kubeadm_control_plane_admin_conf.stat.exists
  block:
    - name: Pull control plane images
      ansible.builtin.command: kubeadm config images pull --config {{ kubeadm_control_plane_config_path }}
      changed_when: true

    - name: Run kubeadm init
      ansible.builtin.command: kubeadm init --config {{ kubeadm_control_plane_config_path }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_control_plane_init

    - name: Save kubeadm init output
      ansible.builtin.copy:
        dest: /root/kubeadm-init.log
        content: "{{ kubeadm_control_plane_init.stdout }}\n"
        owner: root
        group: root
        mode: "0600"

- name: Wait for the API server to be ready
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  register: kubeadm_control_plane_readyz
  until: kubeadm_control_plane_readyz.rc == 0
  retries: 30
  delay: 10
  changed_when: false
