# Se aplica a propósito junto al Deployment para el análisis del taller: usa el
# mismo label app: hola-mundo, así que el Service balancea entre los pods de
# ambos, y al cambiar la imagen del Deployment estos pods se quedan en v1.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: webapp-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hola-mundo
  template:
    metadata:
      labels:
        app: hola-mundo
    spec:
      containers:
      - name: app-container
        image: 954028443875.dkr.ecr.us-east-1.amazonaws.com/k8s-from-scratch/webapp:v1
        ports:
        - containerPort: 5000
